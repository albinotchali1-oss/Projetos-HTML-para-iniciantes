<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Barra Lateral</title>
        <!-- font-awesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"
        />
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
        <script src="https://kit.fontawesome.com/31e3080103.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <!-- botão para abrir a barra lateral -->
        <button class="botao-barra-lateral">
            <i class="fas fa-bars"></i>
        </button>

        <!-- barra lateral -->
        <aside class="barra-lateral">
            <div class="cabecalho-barra-lateral">
                <img src="logo.png" class="logomarca" alt="Logomarca" />
                <button class="botao-fechar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- links -->
            <ul class="links-navegacao">
                <li><a href="#">Início</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Projetos</a></li>
                <li><a href="#">Contato</a></li>
            </ul>

            <!-- redes sociais -->
            <ul class="icones-sociais">
                <li>
                    <a href="https://github.com/albinotchali1-oss" target="_blank">
                        <i class="fab fa-github"></i>
                    </a>
                </li>
                <li>
                    <a href="https://linkedin.com/albinotchali-oss" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                </li>
                <li>
                    <a href="https://albinotchali1-oss.github.io/curriculo-web/" target="_blank"><i class="fa-solid fa-address-book"></i></a>
                </li>
            </ul>
        </aside>
    </body>
</html>
